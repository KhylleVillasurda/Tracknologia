name: CI

on:
  pull_request:
    branches:
      - "feature/**"
      - staging
      - master

  push:
    branches:
      - "feature/**"
      - staging
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit and module tests
        run: pnpm test:run

      - name: Build application
        run: pnpm build

  db-integration:
    name: Database integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.115.0

      - name: Initialize local Supabase config
        run: supabase init

      - name: Configure collision-free database port
        shell: bash
        run: |
          sed -i '0,/port = 54322/s//port = 55432/' supabase/config.toml
          grep -q '^port = 55432$' supabase/config.toml

      - name: Prepare empty local seed
        run: touch supabase/seed.sql

      - name: Start local Supabase
        shell: bash
        run: |
          if supabase start; then
            exit 0
          fi

          echo "::warning::Supabase startup failed; cleaning local state and retrying once."
          supabase stop --all --no-backup || true
          supabase start

      - name: Reset local database
        run: pnpm db:reset

      - name: Export local Supabase test environment
        shell: bash
        run: |
          supabase status -o env \
            --override-name api.url=SUPABASE_TEST_URL \
            --override-name auth.anon_key=SUPABASE_TEST_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_TEST_SERVICE_ROLE_KEY \
            | sed -E 's/^([^=]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - name: Run database integration tests
        run: pnpm test:db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

      # The rehearsal boots its own scratch Supabase lab on offset ports and
      # needs no dev stack, so it runs only after the dev stack has stopped
      # to keep the runner from running two Supabase stacks at once.
      - name: Rehearse pending-only migration upgrade
        run: pnpm rehearse:migrations
