name: Branch Policy

on:
  pull_request:
    branches:
      - "feature/**"
      - staging
      - master
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  validate:
    name: Branch Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate promotion path
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          echo "Validating pull request: ${HEAD_BRANCH} -> ${BASE_BRANCH}"

          # Developer/fork branch names are intentionally unrestricted.
          # Any branch may submit a PR into a protected feature integration branch.
          if [[ "$BASE_BRANCH" == feature/* ]]; then
            echo "Valid contributor PR into feature integration branch."
            exit 0
          fi

          # Only approved upstream integration branches may enter staging.
          if [ "$BASE_BRANCH" = "staging" ]; then
            case "$HEAD_BRANCH" in
              feature/[0-9][0-9]/*)
                echo "Valid feature promotion into staging."
                ;;
              fix/*|hotfix/*|chore/*|dependabot/*)
                echo "Valid maintenance promotion into staging."
                ;;
              *)
                echo "::error::Invalid source branch for staging."
                echo "Expected feature/NN/name, fix/*, hotfix/*, chore/*, or dependabot/*."
                exit 1
                ;;
            esac

            exit 0
          fi

          # Master accepts releases only from staging.
          if [ "$BASE_BRANCH" = "master" ]; then
            if [ "$HEAD_BRANCH" != "staging" ]; then
              echo "::error::Only staging may be merged into master."
              exit 1
            fi

            echo "Valid release promotion: staging -> master"
            exit 0
          fi

          echo "::error::Unexpected protected target branch: $BASE_BRANCH"
          exit 1
